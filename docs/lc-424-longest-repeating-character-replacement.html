:"# change every letter except the top one"},{"src":"                longest = max(longest, j - i + 1)","comment":""},{"src":"    return longest","comment":""}]}},"approaches":[{"id":"sliding-window-count-array","name":"Sliding window + counting array","pattern":"Sliding window","ds":["Array"],"time":"O(26 · n) = O(n)","space":"O(26): one counter per uppercase letter","card":{"signals":"\"substring\" (contiguous), \"at most k\" changes (a limit every window must keep) and \"longest\". A window is good when changes = length - (count of its most common letter) ≤ k: change all the other letters.","pattern":"a variable-size window. right adds one letter every round; while the window is bad, left drops letters. Each index enters the window once and leaves at most once. Each step also scans the 26 letters in find_top: a constant that does not grow with n, so the counter below does not count it.","coreIdea":"add s[right] to count. Compute length, the top letter (find_top: one pass over the 26 counters), top_count and changes = length - top_count. While changes > k, drop s[left], move left and compute the four values again. After the while loop the window is good, so it is a candidate for longest."},"invariant":"After the while loop, changes = (right - left + 1) - top_count ≤ k, and count holds how often each letter is in s[left..right].","phases":{"init":"start","expand":"add s[right]","shrink":"drop s[left]","update":"best ↑","compare":"best stays","return":"done"},"legend":[{"swatch":"ptr-back","text":"left: left edge of the window"},{"swatch":"ptr-front","text":"right: right edge (new letter)"},{"swatch":"band-window","text":"good window [left, right]: changes ≤ k"},{"swatch":"band-bad","text":"bad window: changes > k"},{"swatch":"current","text":"letter just added"},{"swatch":"conflict","text":"in a bad window: a letter to change (not the top letter)"},{"swatch":"removed","text":"letter being dropped"},{"swatch":"out","text":"left the window for good"},{"swatch":"bar",
